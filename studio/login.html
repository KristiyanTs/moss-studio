<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOSS Studio · Sign in</title>
<style>
  :root { --bg:#0e0f12; --panel:#17191e; --line:#2a2d35; --text:#e8e9ec; --muted:#8b8f99; --accent:#7c8cff; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:13px; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:#0e0f12; color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:12px; width:100%; padding:11px; border:0; border-radius:9px; background:var(--accent); color:#0b0c10; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--bad); font-size:13px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
<form id="f">
  <h1>MOSS Studio</h1>
  <p>Image generation queue</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const f = document.getElementById("f"), go = document.getElementById("go"), err = document.getElementById("err");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true; err.textContent = "";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Studio": "1" },
        body: JSON.stringify({ password: document.getElementById("pw").value }) });
      if (r.ok) { location.replace("/"); return; }
      const d = await r.json().catch(() => ({}));
      err.textContent = d.detail || "Sign-in failed.";
    } catch { err.textContent = "Cannot reach the server."; }
    go.disabled = false;
  });
</script>
</body>
</html>
